<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#171512" />
  <meta name="description" content="RecipeFlow Zero — local-first recipe manager, meal planner, grocery budgeter and on-device AI cooking assistant." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <title>RecipeFlow Zero</title>
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="home" aria-label="Go home"><span class="brand-mark">R0</span><span><strong>RecipeFlow</strong><small>ZERO</small></span></button>

    </nav>
  </div>
  <dialog id="modal"><div id="modal-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
